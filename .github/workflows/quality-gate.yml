name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  python-checks:
    name: Python compile and unit tests
    runs-on: ubuntu-latest
    env:
      ASR_API_KEYS: ${{ secrets.ASR_API_KEYS }}
      ASR_STREAM_TOKEN_SECRET: ${{ secrets.ASR_STREAM_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[test]'

      - name: Compile Python files
        run: python -m compileall app tests

      - name: Run tests
        run: pytest
